<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="redGlow" cx="35%" cy="25%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="60%" style="stop-color:#FF454F;stop-opacity:0.8" />
      <stop offset="85%" style="stop-color:#D73535;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B71C1C;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="highlight" cx="30%" cy="25%" r="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Main bubble -->
  <circle cx="32" cy="32" r="28" fill="url(#redGlow)"/>
  
  <!-- Inner highlight -->
  <ellipse cx="24" cy="24" rx="10" ry="8" fill="url(#highlight)"/>
  
  <!-- Small specular highlight -->
  <circle cx="20" cy="20" r="3" fill="#ffffff" opacity="0.9"/>
  
  <!-- Subtle shadow edge -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.4"/>
</svg>
