<svg width="320" height="86" viewBox="0 0 320 86" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC8F5" />
      <stop offset="100%" style="stop-color:#168BFF" />
    </linearGradient>
    <linearGradient id="btnHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.32" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <rect x="0" y="8" width="320" height="78" rx="39" fill="#02050D" opacity="0.5"/>
  
  <!-- Button -->
  <rect x="0" y="0" width="320" height="78" rx="39" fill="url(#btnPrimary)" stroke="#0a3d91" stroke-width="2"/>
  
  <!-- Highlight -->
  <rect x="12" y="6" width="296" height="39" rx="19.5" fill="url(#btnHighlight)"/>
  
  <!-- Text -->
  <text x="160" y="48" font-family="Arial Black, Trebuchet MS, Arial, sans-serif" 
        font-size="32" font-weight="900" text-anchor="middle" fill="#ffffff">PLAY</text>
</svg>
