<svg width="280" height="24" viewBox="0 0 280 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1730" />
      <stop offset="100%" style="stop-color:#02050D" />
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE38A" />
      <stop offset="100%" style="stop-color:#FFC928" />
    </linearGradient>
    <linearGradient id="barHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background track -->
  <rect x="0" y="6" width="280" height="12" rx="6" fill="url(#barBg)" stroke="#31507F" stroke-width="1"/>
  
  <!-- Fill bar -->
  <rect x="2" y="8" width="200" height="8" rx="4" fill="url(#barFill)"/>
  
  <!-- Fill highlight -->
  <rect x="2" y="8" width="200" height="4" rx="4" fill="url(#barHighlight)"/>
</svg>
