<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Color change bubble">
  <defs>
    <clipPath id="bubbleClip">
      <circle cx="24.5" cy="24.5" r="19"/>
    </clipPath>
    <!-- Base sphere: pink → violet → indigo, light from the top. -->
    <linearGradient id="baseHue" x1="24%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#E84FA3"/>
      <stop offset="48%" stop-color="#8A4DE0"/>
      <stop offset="100%" stop-color="#3D35B5"/>
    </linearGradient>
    <!-- Warm magenta bloom, upper-left -->
    <radialGradient id="pinkBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8FC7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF8FC7" stop-opacity="0"/>
    </radialGradient>
    <!-- Fresh green-yellow heart of the bubble -->
    <radialGradient id="greenBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E4FF6E"/>
      <stop offset="55%" stop-color="#7BD94A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7BD94A" stop-opacity="0"/>
    </radialGradient>
    <!-- Cool cyan-blue sweep, right/lower side -->
    <radialGradient id="blueBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FA9F5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3FA9F5" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft shade in the lower-right so the sphere reads as 3D. -->
    <radialGradient id="bubbleShade" cx="80%" cy="84%" r="72%">
      <stop offset="0%" stop-color="#2E1A6E" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2E1A6E" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflective highlight band, fading out like glass. -->
    <linearGradient id="specular" x1="18%" y1="10%" x2="62%" y2="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Plus badge: contrasting red disc with a bright white ring. -->
    <linearGradient id="plusDisc" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F2565B"/>
      <stop offset="100%" stop-color="#C21D2B"/>
    </linearGradient>
  </defs>

  <!-- Main colourful glossy bubble -->
  <g clip-path="url(#bubbleClip)">
    <circle cx="24.5" cy="24.5" r="19" fill="url(#baseHue)"/>
    <ellipse cx="15.5" cy="13" rx="10" ry="8.6" fill="url(#pinkBloom)"/>
    <ellipse cx="27.5" cy="26" rx="13" ry="11" fill="url(#greenBloom)"/>
    <ellipse cx="33.5" cy="33.5" rx="10.5" ry="9" fill="url(#blueBloom)"/>
    <circle cx="24.5" cy="24.5" r="19" fill="url(#bubbleShade)"/>
    <!-- Smooth reflective highlight -->
    <ellipse cx="18.5" cy="14.8" rx="7.4" ry="5.2" fill="url(#specular)" transform="rotate(-32 18.5 14.8)"/>
    <circle cx="13.2" cy="20.8" r="2.3" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <!-- Rim light around the sphere edge -->
  <circle cx="24.5" cy="24.5" r="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="1.6"/>

  <!-- Small circular Plus badge overlapping the bubble's bottom-right -->
  <circle cx="41.5" cy="41.5" r="10" fill="url(#plusDisc)" stroke="#FFFFFF" stroke-width="2.4"/>
  <rect x="36.6" y="40.05" width="9.8" height="2.9" rx="1.45" fill="#FFFFFF"/>
  <rect x="40.05" y="36.6" width="2.9" height="9.8" rx="1.45" fill="#FFFFFF"/>
</svg>
